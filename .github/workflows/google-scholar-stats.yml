name: google-scholar-stats

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      # Google blocks CI IPs fairly often. If the scrape fails we keep the
      # previously committed assets/gs_data.json rather than blanking the badge.
      - name: Fetch citation stats
        id: fetch
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: 9rqTLMcAAAAJ
        run: python bin/gs_citations.py

      - name: Commit refreshed stats
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- assets/gs_data.json; then
            echo "No change in citation stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gs_data.json
          git commit -m "chore: update Google Scholar stats"
          git push

      - name: Report scrape failure
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::Google Scholar scrape failed; keeping the previously committed stats."
